services:
  postgres:
    image: postgres:16
    container_name: fishwish-postgres
    environment:
      POSTGRES_DB: fishwish
      POSTGRES_USER: fishwish
      POSTGRES_PASSWORD: fishwish123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fishwish-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fishwish-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  product-service:
    build:
      context: ../apps/product-service
      dockerfile: Dockerfile
    container_name: fishwish-product-service
    ports:
      - "8091:8081"
    depends_on:
      - postgres

  order-service:
    build:
      context: ../apps/order-service
      dockerfile: Dockerfile
    container_name: fishwish-order-service
    ports:
      - "8092:8082"
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=fishwish
      - PGUSER=fishwish
      - PGPASSWORD=fishwish123
      - PRODUCT_SERVICE_URL=http://product-service:8081/api/products
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - postgres
      - product-service

volumes:
  postgres_data:
