server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false  # ⚠️ CAMBIAR A FALSE EN PRODUCCIÓN
    properties:
      hibernate:
        format_sql: false

app:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081/api/products}
